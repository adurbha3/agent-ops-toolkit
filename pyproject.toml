[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentops*"]

[project]
name = "agent-ops-toolkit"
version = "0.1.0"
description = "A resilience and observability layer for tool-using AI agents: retries, timeouts, output validation, tracing/metrics, and a regression-test pipeline"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
    "sentence-transformers>=3.0",
    "transformers>=4.40",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
